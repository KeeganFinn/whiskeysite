{% extends "base.html" %}
{% block title %}Review Bottle{% endblock %}

{% block content %}
<div class="col-lg-6 offset-lg-3 mt-4">

  <h4 class="fw-bold mb-2">
    {{ event_bottle.canonical_bottle.name }}
  </h4>

  <div class="text-muted mb-3">
    Event: <strong>{{ event.name }}</strong>
  </div>

  <form method="post">
    {% csrf_token %}

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nose</label>
        <input type="number" name="nose" min="0" max="10"
               class="form-control score-input" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Taste</label>
        <input type="number" name="taste" min="0" max="10"
               class="form-control score-input" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Finish</label>
        <input type="number" name="finish" min="0" max="10"
               class="form-control score-input" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Value</label>
        <input type="number" name="value" min="0" max="10"
               class="form-control score-input" required>
      </div>
    </div>

    <div class="mt-3">
      <label class="form-label">Notes</label>
      <textarea name="notes"
                rows="3"
                maxlength="1000"
                class="form-control"
                placeholder="Optional tasting notes"></textarea>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-whiskey w-100">
        Submit Review
      </button>

      <a href="{% url 'event_detail' event.id %}"
         class="btn btn-outline-secondary w-100">
        Cancel
      </a>
    </div>

  </form>

</div>
{% endblock %}
