{% extends "base.html" %}
{% block title %}Change Email{% endblock %}
{% block content %}

<div class="col-md-6 offset-md-3">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
            <h3 class="text-center mb-4 fw-bold">Change Email</h3>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    {{ form.email }}
                </div>

                <button class="btn btn-whiskey w-100 py-2 mt-2">Save Email</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
