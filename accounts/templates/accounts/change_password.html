{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}

<div class="col-md-6 offset-md-3">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
            <h3 class="text-center mb-4 fw-bold">Change Password</h3>

            <form method="POST">
                {% csrf_token %}

                <!-- Old Password -->
                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <div class="input-group">
                        {{ form.old_password }}
                        <button type="button" class="btn btn-outline-secondary toggle-password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- New Password -->
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <div class="input-group">
                        {{ form.new_password1 }}
                        <button type="button" class="btn btn-outline-secondary toggle-password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>

                    <!-- Password Strength Meter -->
                    <div class="mt-2">
                        <div id="password-strength-bar"
                             style="height: 6px; border-radius: 3px; background-color: #ddd; width: 0%; transition: width 0.4s ease, background-color 0.4s ease;">
                        </div>
                        <small id="password-strength-text" class="text-muted"></small>
                    </div>

                    <div class="form-text mt-2">
                        {{ form.new_password1.help_text|safe }}
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                <div class="input-group">
                    {{ form.new_password2 }}
                    <button type="button" class="btn btn-outline-secondary toggle-password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                </div>

                <button class="btn btn-whiskey w-100 mt-3">Save Password</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
