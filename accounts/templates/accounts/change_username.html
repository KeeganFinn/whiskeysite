{% extends "base.html" %}
{% block title %}Change Username{% endblock %}
{% block content %}

<div class="col-md-6 offset-md-3 mt-4">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
            <h3 class="text-center mb-4 fw-bold">Change Username</h3>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-whiskey w-100 mt-3">Save New Username</button>
            </form>

            <p class="text-muted text-center mt-3">
                You may change your username once every 30 days.
            </p>
        </div>
    </div>
</div>

{% endblock %}
